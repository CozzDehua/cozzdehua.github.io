<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.title | escape }} — Cozz. blog">
  <title>{{ page.title | escape }} | Cozz. Blog</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="blog-shell">
  <header class="blog-header">
    <a class="blog-brand" href="{{ '/' | relative_url }}">Cozz<span>.</span></a>
    <a class="blog-back" href="{{ '/blog.html' | relative_url }}">← Blog</a>
  </header>
  <main class="post-page">
    <p class="section-kicker">BLOG / NOTE</p>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    <article class="post-content">
      {{ content }}
    </article>
  </main>
</body>
</html>
